name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Copiar o app web para dentro do APK
        run: |
          mkdir -p app/src/main/assets/www
          cp -r index.html manifest.webmanifest css js vendor assets app/src/main/assets/www/

      - name: Recriar a chave de assinatura (segredo do repositório)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os segredos KEYSTORE_BASE64 e/ou KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/termo.keystore

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log; then
            grep -E "error:|What went wrong|Caused by|> " build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk interdicao-embargo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: interdicao-embargo-apk
          path: interdicao-embargo.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Interdição e Embargo 1.0.${{ github.run_number }}
          files: interdicao-embargo.apk
          make_latest: true
